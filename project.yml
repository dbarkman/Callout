name: Callout
options:
  bundleIdPrefix: com.redmesastudios
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: XWQQQ8GD2Z
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    Release:
      SWIFT_COMPILATION_MODE: wholemodule

packages:
  CalloutCore:
    path: CalloutCore

targets:
  Callout:
    type: application
    platform: iOS
    sources:
      - path: Callout
    dependencies:
      - package: CalloutCore
        product: CalloutCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.redmesastudios.Callout
        PRODUCT_NAME: Callout
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Callout
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        # GENERATE_INFOPLIST_FILE stays on, so the INFOPLIST_KEY_* values merge into this file.
        Debug:
          INFOPLIST_FILE: Config/Info.plist
        Release:
          INFOPLIST_FILE: Config/Info.plist

schemes:
  Callout:
    shared: true
    build:
      targets:
        Callout: all
    run:
      config: Debug
    archive:
      config: Release
